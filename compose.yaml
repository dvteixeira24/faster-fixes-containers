name: faster-fixes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasterfixes
      POSTGRES_USER: fasterfixes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasterfixes -d fasterfixes"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env}
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fasterfixes:${POSTGRES_PASSWORD}@db:5432/fasterfixes?schema=public
    command: ["pnpm", "--dir", "packages/database", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fasterfixes:${POSTGRES_PASSWORD}@db:5432/fasterfixes?schema=public
      NODE_ENV: production
      NEXT_PUBLIC_IS_CLOUD: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
