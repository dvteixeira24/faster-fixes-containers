name: faster-fixes

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fasterfixes
      POSTGRES_USER: fasterfixes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasterfixes -d fasterfixes"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env}
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fasterfixes:${POSTGRES_PASSWORD}@db:5432/fasterfixes?schema=public
    command: ["pnpm", "--dir", "packages/database", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: ["inngest", "start", "--host", "0.0.0.0", "--sqlite-dir", "/app/data", "--sdk-url", "http://web:3000/api/inngest", "--poll-interval", "60"]
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?Set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?Set INNGEST_SIGNING_KEY in .env}
    volumes:
      - inngest_data:/app/data
    ports:
      - "127.0.0.1:${INNGEST_PORT:-8288}:8288"
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    image: ${GHCR_IMAGE:?Set GHCR_IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fasterfixes:${POSTGRES_PASSWORD}@db:5432/fasterfixes?schema=public
      NODE_ENV: production
      NEXT_PUBLIC_IS_CLOUD: "false"
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?Set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?Set INNGEST_SIGNING_KEY in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      inngest:
        condition: service_healthy

volumes:
  postgres_data:
  inngest_data:
